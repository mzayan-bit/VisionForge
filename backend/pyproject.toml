[project]
name = "visionforge-backend"
version = "0.1.0"
description = "VisionForge: Computer Vision Workbench API & Core System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "VisionForge Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "huggingface_hub>=0.21.0",
    "sentencepiece>=0.2.0",
    "torchvision>=0.17.0",
    "scikit-learn>=1.9.0",
    "ultralytics>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visionforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
